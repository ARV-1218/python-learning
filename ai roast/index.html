<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ROAST</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="about_me">
        <label for="" id="name_txt">Enter your name:</label>
        <input type="text" id="name" autocomplete="off"><br>
        <label for="" id="smtg_abt_me_text">Tell something about you:</label>
        <textarea  id="abt_para"></textarea>
        <button id="submit">Roast Me🔥</button>
        
    </div>
    <div id="dialog_overlay">
    <div id="dialog">
        <button id="close_dialog">&times;</button>

        <div class="dialog_icon">🔥</div>

        <h2>Your Roast Is Ready</h2>

        <p id="dialog_roast">
            Your roast will appear here.
        </p>

        <button id="roast_again">Roast Again 😂</button>
    </div>
</div>
</body>
<script src="script.js"></script>
</html>
